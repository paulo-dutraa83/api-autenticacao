
server:
  port: 8082

spring:
  application:
    name: api-autenticacao

  datasource:
    url: jdbc:mysql://localhost:3307/bd-autenticacao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
